name: Terraform

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.hcl"
      - ".terraform-version"
      - ".terragrunt-version"
      - ".mise.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every root is a Terragrunt unit, so terraform is only installed
      # as a dependency for terragrunt to shell out to; the pipeline
      # never invokes terraform per root.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8 # keep in sync with .terraform-version
      # terragrunt hcl fmt only covers terragrunt HCL (root.hcl,
      # terragrunt.hcl). Modules now live in AJCandfield/tf-modules and
      # are formatted/linted by that repository's CI.
      - name: Check Terragrunt HCL formatting
        uses: gruntwork-io/terragrunt-action@v2
        with:
          tg_version: 1.1.1 # keep in sync with .terragrunt-version
          tg_command: hcl fmt --check
      # Discovers every unit (terragrunt.hcl) recursively from the repo
      # root; new clouds or stacks need no pipeline edits. Terragrunt
      # handles init and generated backend/provider files per unit.
      - name: Validate every Terragrunt unit
        uses: gruntwork-io/terragrunt-action@v2
        with:
          tg_version: 1.1.1
          tg_command: run --all --non-interactive -- validate
        env:
          # Passed to whichever provider each unit needs; GITLAB_TOKEN
          # becomes required once units exist under clouds/gitlab.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
