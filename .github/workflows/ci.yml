name: Terraform

on:
  pull_request:
    paths:
      - "clouds/**"
      - ".mise.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: Check Terragrunt HCL formatting
        run: terragrunt hcl fmt --check
      - name: Validate every Terragrunt unit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: terragrunt run --all --non-interactive -- validate
