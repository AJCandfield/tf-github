name: Terraform

on:
  pull_request:
    paths:
      - "clouds/**"
      - ".mise.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/toolchain-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ajcandfield/tf-repos-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check Terragrunt HCL formatting
        run: terragrunt hcl fmt --check
      - name: Validate every Terragrunt unit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: terragrunt run --all --non-interactive -- validate
